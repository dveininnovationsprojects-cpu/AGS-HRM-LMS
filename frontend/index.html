<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://cdn-bpead.nitrocdn.com/BBpeMUqwtpRtLgerjeQhQjKhWBtMWEQP/assets/images/optimized/rev-e5326ea/www.agshealth.com/wp-content/uploads/2022/09/ags-siticon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AGS Health Workforce Intelligence Platform - Enterprise HRM & LMS" />
    <title>AGS Health | Workforce Intelligence Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <script type="text/javascript">
      // Pre-initialize googtrans cookie before Google Translate script loads
      (function() {
        var lang = localStorage.getItem('currentLanguage') || 'en';
        var cookieVal = '/en/' + lang;
        document.cookie = 'googtrans=' + cookieVal + '; path=/';
        document.cookie = 'googtrans=' + cookieVal + '; path=/; domain=' + window.location.hostname;
        if (window.location.hostname.includes('.')) {
          var parts = window.location.hostname.split('.');
          if (parts.length > 2) {
            var rootDomain = '.' + parts.slice(-2).join('.');
            document.cookie = 'googtrans=' + cookieVal + '; path=/; domain=' + rootDomain;
          }
        }
      })();
    </script>
    
    <style>
      /* Base styles */
      body {
        top: 0px !important;
        position: static !important;
      }
      /* Completely hide Google Translate UI elements and animations */
      #google_translate_element,
      .skiptranslate,
      iframe.goog-te-banner-frame,
      .goog-te-banner-frame,
      #goog-gt-tt,
      .goog-te-balloon-frame,
      .goog-tooltip,
      .goog-tooltip:hover,
      .goog-te-spinner-pos,
      .goog-te-spinner,
      .goog-te-spinner-animation {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        height: 0 !important;
        width: 0 !important;
        pointer-events: none !important;
      }
      /* Hide the tooltip popup and highlights */
      .goog-text-highlight {
        background-color: transparent !important;
        box-shadow: none !important;
        border: none !important;
      }
      /* Prevent the layout from being pushed down */
      body {
        min-height: 100vh;
        top: 0px !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Google Translate Widget Container (Hidden) -->
    <div id="google_translate_element" style="display:none; position:fixed; visibility:hidden; width:0; height:0; z-index:-999;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
